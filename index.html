<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardSPApp/tm_icon_sp.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- iframeのURLは常に「パラメータなしの固定URL」にする -->
  <iframe id="timecard-frame" src="https://script.google.com/macros/s/AKfycbyMf2HNrRsDznKmx6vzVBcgvihoq2MYvdA7P0HVX6DXPN9hh3rY24y-rajsw8zE8pDbfA/exec" allow="geolocation"></iframe>

  <script>
    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      let storeNameFromUrl = urlParams.get('s');

      let targetStore = "";

      if (storeNameFromUrl) {
        // URLに店舗名があれば、GitHub Pages側の localStorage に保存
        targetStore = decodeURIComponent(storeNameFromUrl).trim();
        try {
          localStorage.setItem('gh_saved_store_name', targetStore);
        } catch(e) {}
      } else {
        // URLにない場合は、前回保存した店舗名を復元
        try {
          targetStore = localStorage.getItem('gh_saved_store_name') || "";
        } catch(e) {}
      }

      // iframeの読み込みが完了したら、GAS側に店舗名を送信する
      const iframe = document.getElementById('timecard-frame');
      iframe.onload = function() {
        if (targetStore) {
          iframe.contentWindow.postMessage({ storeName: targetStore }, '*');
        }
      };
    };
  </script>

</body>
</html>
