<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardSPApp/tm_icon_sp.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="timecard-frame" src="" allow="geolocation"></iframe>

  <script>
    window.onload = function() {
      // 1. GitHub PagesのURLから「?s=〇〇」の店舗名を取得（URLは固定仕様のまま）
      const urlParams = new URLSearchParams(window.location.search);
      let storeName = urlParams.get('s');

      // 2. 基本となるGASのウェブアプリURL
      const gasBaseUrl = "https://script.google.com/macros/s/AKfycbzxCJU9lqKemrO0MrLyEQh8bFbfpNZeVeJzGjMvx1wsx2j82RZjt6mKtuKxtMYWjhxLMg/exec";

      // 3. 店舗パラメータがあればURLに結合、なければそのまま
      const iframeSrc = storeName ? `${gasBaseUrl}?s=${encodeURIComponent(storeName)}` : gasBaseUrl;

      // 4. iframeにURLをセットして表示
      document.getElementById('timecard-frame').src = iframeSrc;
    };

    // GAS側（iframe内）とのデータ受け渡し処理
    window.addEventListener('message', function(event) {
      if (!event.data || !event.data.type) return;

      const iframe = document.getElementById('timecard-frame');

      if (event.data.type === 'REQUEST_USER') {
        // GAS側の準備ができたら、保存してある店舗名・スタッフ名を返信する
        const savedStore = localStorage.getItem('ofs_saved_store') || "";
        const savedStaff = localStorage.getItem('ofs_saved_staff') || "";
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({
            type: 'RESTORE_USER',
            store: savedStore,
            staff: savedStaff
          }, '*');
        }
      } else if (event.data.type === 'SAVE_USER') {
        // 選択された店舗名・スタッフ名をGitHub Pages側に保存
        if (event.data.store !== undefined) {
          localStorage.setItem('ofs_saved_store', event.data.store);
        }
        if (event.data.staff !== undefined) {
          localStorage.setItem('ofs_saved_staff', event.data.staff);
        }
      } else if (event.data.type === 'CLEAR_STAFF') {
        // 「変更」が押されたらスタッフ名を削除
        localStorage.removeItem('ofs_saved_staff');
      }
    });
  </script>

</body>
</html>
