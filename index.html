<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardSPApp/tm_icon_sp.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="timecard-frame" src="" allow="geolocation"></iframe>

  <script>
    window.onload = function() {
      // 1. GitHub PagesのURLから「?s=〇〇」の店舗名を取得
      const urlParams = new URLSearchParams(window.location.search);
      let storeName = urlParams.get('s');

      // 2. 基本となるGASのウェブアプリURL
      const gasBaseUrl = "https://script.google.com/macros/s/AKfycbwsVIWC1vseKC0MtXt4DW1ZkUv6-sXyMKmo38-e1gQoMqVp7cMcTfRBSYHN-LJHvcQN/exec";

      // 3. 店舗パラメータがあればURLに結合、なければそのまま
      const iframeSrc = storeName ? `${gasBaseUrl}?s=${encodeURIComponent(storeName)}` : gasBaseUrl;

      // 4. iframeにURLをセットして表示
      document.getElementById('timecard-frame').src = iframeSrc;
    };
  </script>

</body>
</html>
