<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <link rel="apple-touch-icon" href="https://otarufoodsystem.github.io/timecardSPApp/tm_icon_sp.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OFSタイムカード">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OFSタイムカード</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #fff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="timecard-frame" src="https://script.google.com/macros/s/AKfycbxVIymLlwFHqo-vnJlPTGURPNJ8c0GHdKaZ61Y6DG_Rb5QMdThD3Gy3nv_hY3JWCcl1LQ/exec" allow="geolocation"></iframe>

  <script>
    const gasBaseUrl = "https://script.google.com/macros/s/AKfycbxVIymLlwFHqo-vnJlPTGURPNJ8c0GHdKaZ61Y6DG_Rb5QMdThD3Gy3nv_hY3JWCcl1LQ/exec";

    function getCookieValue(name) {
      if (!document.cookie) return '';
      const prefix = name + '=';
      const parts = document.cookie.split(';');
      for (let i = 0; i < parts.length; i++) {
        const c = parts[i].trim();
        if (c.indexOf(prefix) === 0) {
          return decodeURIComponent(c.substring(prefix.length));
        }
      }
      return '';
    }

    function setCookieValue(name, value, maxAgeSec) {
      try {
        document.cookie = name + '=' + encodeURIComponent(value) + '; max-age=' + maxAgeSec + '; path=/; SameSite=Lax';
      } catch (e) {}
    }

    function getOrCreateDeviceId() {
      let id = '';
      try {
        id = (localStorage.getItem('ofs_device_id') || '').trim();
      } catch (e) {}

      if (!id) {
        id = (getCookieValue('ofs_device_id') || '').trim();
      }

      if (!id) {
        id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 10);
      }

      try {
        localStorage.setItem('ofs_device_id', id);
      } catch (e) {}
      setCookieValue('ofs_device_id', id, 31536000);

      return id;
    }

    function resolveStoreName() {
      const urlParams = new URLSearchParams(window.location.search);
      const fromUrl = urlParams.get('s');
      let store = '';

      if (fromUrl) {
        store = decodeURIComponent(fromUrl).trim();
        try {
          localStorage.setItem('gh_saved_store_name', store);
        } catch (e) {}
        setCookieValue('ofs_store_name', store, 31536000);
      } else {
        try {
          store = (localStorage.getItem('gh_saved_store_name') || '').trim();
        } catch (e) {}
        if (!store) {
          store = (getCookieValue('ofs_store_name') || '').trim();
        }
      }
      return store;
    }

    const deviceId = getOrCreateDeviceId();
    const targetStore = resolveStoreName();

    function sendInitToIframe() {
      const iframe = document.getElementById('timecard-frame');
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({
          type: 'OFS_INIT',
          storeName: targetStore,
          deviceId: deviceId
        }, '*');
      }
    }

    window.addEventListener('message', function(event) {
      if (event.data && event.data.type === 'OFS_READY') {
        sendInitToIframe();
      }
    });

    window.addEventListener('DOMContentLoaded', function() {
      const iframe = document.getElementById('timecard-frame');
      if (iframe && iframe.src !== gasBaseUrl) {
        iframe.src = gasBaseUrl;
      }
      if (iframe) {
        iframe.addEventListener('load', function() {
          sendInitToIframe();
        });
      }
    });
  </script>

</body>
</html>
